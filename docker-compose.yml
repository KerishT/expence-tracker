services:
  postgres:
    image: postgres:16-alpine
    container_name: expence-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expence_tracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "8080:8080"
    command:
      - "--transport=http"
      - "--port=8080"
      - "--dsn=postgresql://postgres:postgres@postgres:5432/expence_tracker?sslmode=disable"
    depends_on:
      - postgres

volumes:
  postgres_data:
